[project]
name = "llm-engineer-lab"
version = "0.1.0"
description = "Hands-on LLM application engineering course with a browser classroom"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "AlexXuz"}]
dependencies = [
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "python-dotenv==1.2.4",
  "pydantic==2.14.1",
  "openai==3.29.0",
  "psycopg[binary]==3.3.6",
  "pgvector==0.5.1",
  "numpy==2.4.6",
  "pypdf==6.10.0",
  "langgraph==1.2.17",
  "langchain-core==1.6.12",
  "langgraph-checkpoint-sqlite==3.1.2",
  "mcp==1.30.0",
  "sqlglot==30.24.0",
  "markdown-it-py==4.2.0",
  "PyYAML==6.0.3",
  "python-docx==1.2.0"
]

[project.urls]
Repository = "https://github.com/AlexXuz/llm-engineer-lab"
Issues = "https://github.com/AlexXuz/llm-engineer-lab/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
