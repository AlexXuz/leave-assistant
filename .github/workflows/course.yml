name: Course & starter checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  reference-package:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_DB: course_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_disposable
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d course_ci"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: course_ci
      PGUSER: postgres
      PGPASSWORD: ci_only_disposable
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -c requirements/course.lock.txt -r requirements/course-runtime.txt
      - run: mkdir -p tmp reports
      - run: python -m scripts.check_public_project
      - run: python -m unittest discover -s tests
      - run: python -m scripts.check_course_revision
      - run: python -m scripts.check_course_package
      - run: python -m scripts.check_course_http
      - run: python -m scripts.check_study_shell
      - run: python -m scripts.check_leave_web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: course-check-reports
          path: |
            reports/course-package-*.json
            reports/course-http-*.json
            reports/course-revision-*.json
            reports/course-study-shell-*.json
