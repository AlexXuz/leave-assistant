name: leave-course
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_DB: ${PGDATABASE:?Set PGDATABASE}
      POSTGRES_USER: ${PGUSER:?Set PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD}
    volumes:
    - course_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.course
    env_file: ../.env
    environment:
      PGHOST: postgres
      PGPORT: '5432'
      PGDATABASE: ${PGDATABASE:?Set PGDATABASE}
      PGUSER: ${PGUSER:?Set PGUSER}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD}
      PGSSLMODE: disable
    ports:
    - 127.0.0.1:8013:8000
    volumes:
    - course_checkpoints:/app/tmp/course
    - course_reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  course_pgdata: null
  course_checkpoints: null
  course_reports: null
